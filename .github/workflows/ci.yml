name: CI baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-baseline:
    name: ci-baseline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.24.0"
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - run: make format-check
      - run: make lint
      - run: make typecheck
      - run: make test-unit
      - run: make eval
      - run: make test-integration
      - run: make test-e2e
      - run: docker compose config --quiet
      - run: infrastructure/scripts/test_images.sh
      - run: infrastructure/scripts/generate_sbom.sh
      - run: infrastructure/scripts/scan_vulnerabilities.sh
      - name: Run tenant isolation release blocker
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:54322/postgres
        run: make test-security
