name: agents-factory

x-python-application: &python-application
  image: ghcr.io/astral-sh/uv:0.12.5-python3.12-trixie
  working_dir: /workspace
  volumes:
    - ./:/workspace:ro
  environment: &runtime-environment
    ENVIRONMENT: ${ENVIRONMENT:-development}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DATABASE_URL: ${DATABASE_URL:-}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    SUPABASE_URL: ${SUPABASE_URL:-}
    SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
    SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:-}
    SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-}
    APP_MASTER_KEY: ${APP_MASTER_KEY:-}
    META_APP_SECRET: ${META_APP_SECRET:-}
    META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
    META_APP_ID: ${META_APP_ID:-}
    META_CONFIGURATION_ID: ${META_CONFIGURATION_ID:-}
    META_REDIRECT_URI: ${META_REDIRECT_URI:-}
    META_GRAPH_API_BASE_URL: ${META_GRAPH_API_BASE_URL:-https://graph.facebook.com/v25.0}
    GOOGLE_OAUTH_CLIENTS: ${GOOGLE_OAUTH_CLIENTS:-}
    KNOWLEDGE_STORAGE_ROOT: ${KNOWLEDGE_STORAGE_ROOT:-/var/lib/agents-factory/knowledge}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    PYTHONPATH: /workspace/apps/backend/src:/workspace/workers/agent-worker/src:/workspace/workers/knowledge-worker/src:/workspace/workers/outbound-worker/src:/workspace/workers/scheduler/src
    UV_CACHE_DIR: /tmp/uv-cache
    UV_PROJECT_ENVIRONMENT: /tmp/agents-factory-venv
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:8.0.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *python-application
    volumes:
      - ./:/workspace:ro
      - knowledge-source-data:/var/lib/agents-factory/knowledge
    command: ["uv", "run", "--locked", "--package", "agents-factory-backend", "uvicorn", "--app-dir", "apps/backend/src", "agents_factory.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  control-plane:
    image: node:24.19.0-bookworm-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace:ro
    command: ["corepack", "pnpm", "--filter", "@agents-factory/control-plane", "dev", "--hostname", "0.0.0.0"]
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  agent-worker:
    <<: *python-application
    command: ["uv", "run", "--locked", "--package", "agents-factory-agent-worker", "arq", "agent_worker.worker.WorkerSettings"]
    healthcheck:
      test: ["CMD", "uv", "run", "--locked", "--package", "agents-factory-agent-worker", "arq", "agent_worker.worker.WorkerSettings", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  knowledge-worker:
    <<: *python-application
    volumes:
      - ./:/workspace:ro
      - knowledge-source-data:/var/lib/agents-factory/knowledge
    command: ["uv", "run", "--locked", "--package", "agents-factory-knowledge-worker", "arq", "knowledge_worker.worker.WorkerSettings"]
    healthcheck:
      test: ["CMD", "uv", "run", "--locked", "--package", "agents-factory-knowledge-worker", "arq", "knowledge_worker.worker.WorkerSettings", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  outbound-worker:
    <<: *python-application
    command: ["uv", "run", "--locked", "--package", "agents-factory-outbound-worker", "arq", "outbound_worker.worker.WorkerSettings"]
    healthcheck:
      test: ["CMD", "uv", "run", "--locked", "--package", "agents-factory-outbound-worker", "arq", "outbound_worker.worker.WorkerSettings", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  scheduler:
    <<: *python-application
    command: ["uv", "run", "--locked", "--package", "agents-factory-scheduler", "arq", "scheduler.worker.WorkerSettings"]
    healthcheck:
      test: ["CMD", "uv", "run", "--locked", "--package", "agents-factory-scheduler", "arq", "scheduler.worker.WorkerSettings", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  redis-data:
  knowledge-source-data:
