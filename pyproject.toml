[project]
name = "agents-factory-workspace"
version = "0.0.0"
description = "Agents Factory workspace tooling"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "hypothesis==6.138.4",
  "mypy==1.18.2",
  "pytest-asyncio==1.1.0",
  "pytest==8.4.2",
  "ruff==0.12.11",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/backend", "workers/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/backend/tests"]

[tool.mypy]
python_version = "3.12"
strict = true
