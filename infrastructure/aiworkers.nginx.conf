# Activate the HTTPS server only after obtaining its certificate.
server {
    listen 80;
    listen [::]:80;
    server_name aiworkers.zuvel.ai;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/aiworkers-acme;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aiworkers.zuvel.ai;
    ssl_certificate /etc/letsencrypt/live/aiworkers.zuvel.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiworkers.zuvel.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /webhooks/meta/whatsapp {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
